<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mitash</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#F5F6F8; --card:#FFFFFF; --ink:#1D2433; --muted:#667085; --line:#E3E6EB; --soft:#F1F3F6;
  --acc:#1F4E6E; --acc-soft:#E7EEF4; --acc-ink:#1F4E6E;
  --micro:#344054; --micro-soft:#F1F3F6; --termo:#344054; --termo-soft:#F1F3F6; --rep:#344054; --rep-soft:#F1F3F6;
  --ok:#2F6B4F; --ok-soft:#EAF2EE; --warn:#9A5B13; --warn-soft:#F8F0E6; --bad:#A63A32; --bad-soft:#F8ECEB;
  --r:12px; --sh:0 1px 2px rgba(16,24,40,.04);
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
.mono{font-family:var(--mono);font-size:13px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* estructura */
header.top{position:sticky;top:0;z-index:15;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;color:var(--acc-ink);text-decoration:none}
.logo i{width:30px;height:30px;border-radius:7px;background:var(--acc);color:#fff;display:grid;place-items:center;font-style:normal;font-size:16px}
header .sp{flex:1}
.ibtn{border:0;background:var(--soft);color:var(--ink);width:40px;height:40px;border-radius:10px;font-size:18px;cursor:pointer;display:grid;place-items:center}
main{max-width:860px;margin:0 auto;padding:18px 16px 110px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;padding:8px 2px 9px;position:relative}
nav.tabs a .i{display:block;height:24px;margin-bottom:1px} nav.tabs a .i svg,.ibtn svg{width:22px;height:22px}
nav.tabs a.on{color:var(--acc)} 
nav.tabs .dot{position:absolute;top:4px;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:99px;font-size:10px;padding:0 5px;line-height:16px}
@media (min-width:900px){
  nav.tabs{top:62px;bottom:auto;left:max(16px,calc(50% - 640px));right:auto;width:200px;flex-direction:column;background:none;border:0;gap:2px}
  nav.tabs a{display:flex;align-items:center;gap:10px;font-size:14px;padding:10px 12px;border-radius:12px;text-align:left}
  nav.tabs a .i{display:inline-flex;height:auto} nav.tabs a.on{background:var(--acc-soft)}
  nav.tabs .dot{position:static;margin-left:auto}
  main{padding-left:240px;max-width:1100px;padding-bottom:40px}
}

/* piezas */
h1{font-size:22px;line-height:1.2;margin:4px 0 4px;letter-spacing:-.02em;font-weight:600}
h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.card.flat{box-shadow:none}
.sec-t{display:flex;align-items:center;gap:8px;margin:22px 0 10px;font-weight:700;font-size:15px}
.sec-t .n{color:var(--muted);font-weight:600}
.sec-t .sp{flex:1}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:6px}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;text-decoration:none;color:inherit;box-shadow:var(--sh)}
.stat .v{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}
.stat .k{font-size:13px;color:var(--muted);font-weight:500}
.stat.acc .v{color:var(--acc)} .stat.ok .v{color:var(--ok)} .stat.warn .v{color:var(--warn)} .stat.bad .v{color:var(--bad)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--acc);padding:6px 8px}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row .grow{flex:1;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px 6px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.M,.tag.T,.tag.R{background:#fff;color:var(--ink);border:1px solid var(--line)}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.acc{background:var(--acc-soft);color:var(--acc-ink)}
.cli{font-weight:600;font-size:16px}
.lote{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.lote:first-of-type{border-top:0;padding-top:0;margin-top:8px}
.items{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.it{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:4px 4px 4px 9px;background:#fff;font-size:13px}
.it .mono{font-size:12px}
.it.listo{border-color:#bfe3cc;background:var(--ok-soft)}
.it button{border:0;background:var(--soft);border-radius:7px;width:26px;height:26px;cursor:pointer;font-size:13px}
.it.listo button{background:#fff}
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.trip{border-left:4px solid var(--acc)}
.trip.hoy{border-left-color:var(--warn)}
.trip .when{font-weight:700;color:var(--acc-ink);font-size:13px;text-transform:uppercase;letter-spacing:.03em}
.trip.hoy .when{color:var(--warn)}
.todo{display:grid;gap:8px;margin:12px 0}
.todo>div{display:block;background:var(--soft);border-radius:12px;padding:10px 12px}
.todo .ic{font-size:18px;line-height:1.2}
.todo b{display:block;font-size:13px}
.empty{color:var(--muted);text-align:center;padding:26px 10px}

details.more>summary{list-style:none;cursor:pointer;color:var(--acc);font-weight:600;font-size:13px;margin-top:6px}
details.more>summary::-webkit-details-marker{display:none}
.list>div{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.list>div:last-child{border-bottom:0}
.click{cursor:pointer}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-weight:500}

/* hoja (formularios y fichas) */
.ov{position:fixed;inset:0;background:rgba(14,30,28,.35);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:22px}}
.sheet .hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet .hd h2{flex:1;margin:0;font-size:19px}
form.f{display:grid;gap:12px}
form.f label{display:grid;gap:5px;font-weight:600;font-size:13px;color:var(--muted)}
form.f input,form.f select,form.f textarea{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;width:100%;color:var(--ink);font-weight:500}
form.f input:focus,form.f select:focus,form.f textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick label{display:flex!important;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;color:var(--ink)!important}
.pick input{width:auto!important;margin:0}
.pick label:has(input:checked){border-color:var(--acc);background:var(--acc-soft)}
.err{color:var(--bad);font-size:13px;min-height:16px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:40;font-weight:600;font-size:14px;box-shadow:var(--sh)}
.menu a,.menu button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:13px 6px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:600;cursor:pointer}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login form{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh);padding:28px 22px;width:min(380px,100%)}
</style>
</head>
<body>
<header class="top" hidden>
  <a class="logo" href="#taller"><i>M</i>Mitash</a><span class="sp"></span>
  <button class="ibtn" id="bbuscar" aria-label="Buscar equipo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  <button class="ibtn" id="bmenu" aria-label="Más opciones"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</header>
<main id="main" hidden></main>
<nav class="tabs" id="tabs" hidden></nav>
<div id="ov"></div>
<div id="login" class="login" hidden></div>

<script>
window.addEventListener('error', e => { const m=document.getElementById('main'); if(m&&!m.innerHTML) { m.hidden=false; m.innerHTML='<div class="banner">Error: '+(e.message||'')+' (v7)</div>'; } });
</script>
<script>
(() => {
const VERSION = 'v7.6';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS = ['dom','lun','mar','mié','jue','vie','sáb'];
const isoD = d => { const x=new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,10); };
const HOY = isoD(new Date()); const MES = HOY.slice(0,7);
const sumarDias = (f,n) => { const d=new Date(f+'T12:00'); d.setDate(d.getDate()+n); return isoD(d); };
const sumarMeses = (ym,n) => { const d=new Date(+ym.slice(0,4), +ym.slice(5,7)-1+n, 1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); };
const fmt = f => f ? `${f.slice(8,10)}/${f.slice(5,7)}` : '—';
const fmtA = f => f ? `${f.slice(8,10)}/${f.slice(5,7)}/${f.slice(2,4)}` : '—';
const mesTxt = ym => `${MESES[+ym.slice(5,7)-1]}${ym.slice(0,4)!==HOY.slice(0,4)?' '+ym.slice(0,4):''}`;
const cap = s => s ? s[0].toUpperCase()+s.slice(1) : s;
const cuando = f => { if(f===HOY) return 'Hoy'; if(f===sumarDias(HOY,1)) return 'Mañana'; if(f===sumarDias(HOY,-1)) return 'Ayer';
  const d=new Date(f+'T12:00'); return `${cap(DIAS[d.getDay()])} ${fmt(f)}`; };
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const nucleo = s => norm(s).replace(/\b(laboratorio|lab|hospital|hosp|sanatorio|instituto|clinica|dr|dra|de|del|la|el|sede)\b|[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const mismoCli = (a,b) => { const x=nucleo(a), y=nucleo(b); return !!x && !!y && (x===y || x.includes(y) || y.includes(x)); };
const limpioId = x => norm(x).replace(/^id\s*/,'').replace(/[\s.\-_]/g,'');
const cmpInf = (a,b) => { const [x1,x2]=String(a).split('-'), [y1,y2]=String(b).split('-'); return (+x1||0)-(+y1||0) || (+x2||0)-(+y2||0); };
const plural = (n,s,p) => `${n} ${n===1?s:(p||s+'s')}`;

// tipos de ingreso: micropipetas, termómetros y "reparación / otro equipo"
const CAT = t => /micro|pipeta/i.test(t||'') ? 'M' : /term[oó]m|datalog/i.test(t||'') ? 'T' : 'R';
const CATN = {M:['','Micropipeta','Micropipetas'], T:['','Termómetro','Termómetros'], R:['','Reparación','Reparaciones']};
const tagCat = (c,n) => `<span class="tag ${c}">${n!=null?plural(n,CATN[c][1].toLowerCase(),CATN[c][2].toLowerCase()):CATN[c][2]}</span>`;
const TECNICOS = ['Lucho','Claudio','Maxi','Melina','Jorge'];
const PERFILES = { 'de_antoni@hotmail.com':'Claudio' };   // email -> nombre (sumar al equipo acá)
const PUBLIC_FORM = 'https://mitash-lab.github.io/solicitud.html';
const linkForm = (cliente, sede) => PUBLIC_FORM + (cliente ? '?' + new URLSearchParams(Object.entries({cliente, sede}).filter(([,v]) => v)).toString() : '');

const S = { view:(location.hash||'#taller').slice(1), equipos:[], servicios:[], tallerDb:[], sol:[], vis:{}, contactos:{}, internos:{}, r:0,
  f:{ tal:'hacer', cat:'', ven:MES, ped:'abiertos' } };

// ---------------------------------------------------------------- datos (Supabase)
const SB_URL='https://wjebfabcivxmeohyfpxm.supabase.co', SB_KEY='sb_publishable_OwWLV4rfTm58MB7rouvJnw_TDEBfU6J';
const sb = window.supabase ? window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true,autoRefreshToken:true,lock:async(_n,_t,fn)=>await fn()}}) : null;
const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && location.search.includes('local');
const conTiempo = (p,ms) => Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('tiempo')),ms))]);

async function cargarTabla(t){ const out=[]; for(let i=0;;i+=1000){ const {data,error}=await sb.from(t).select('data').range(i,i+999); if(error) throw error; out.push(...data.map(d=>d.data)); if(data.length<1000) break; } return out; }
const deTaller = t => ({tid:String(t.id), ref:t.ref||null, fecha:t.fecha, tipo:t.tipo||'', cliente:t.cliente, sede:t.sede||'', id_equipo:t.id_equipo||'', serie:t.serie||'',
  equipo:t.equipo||null, pedido:t.pedido||'', detalle:t.detalle||'', solicitud:t.solicitud||null, listo:t.listo||null, entregado:t.entregado||null, informe:t.informe||null, cerrado:!!t.cerrado});
// El taller se guarda en la tabla "docs" (colección "taller"): no necesita tablas nuevas. Lo mismo podrá escribir el bot.
async function cargarTaller(){ if(LOCAL) return;
  const desde = sumarDias(HOY,-60);
  const {data,error} = await sb.from('docs').select('id,data').eq('coleccion','taller');
  if(error) throw error; S.tallerDb = data.map(d=>deTaller({...d.data, id:d.id})).filter(t=>!t.entregado || t.entregado>=desde); }
async function cargarSol(){ if(LOCAL){ S.solOk=true; return; }
  const {data,error}=await sb.from('solicitudes').select('*').order('creada',{ascending:false}).limit(300); S.solOk=!error; if(!error) S.sol=data; }
// Base de equipos: sale de los informes de micropipetas y certificados de termómetros que sube la compu de casa.
function armarBase(inf, ter){
  const serv = [];
  inf.forEach(r=>{ if(!r.fecha||!r.informe) return; const cli = /mitash/i.test(r.cliente||'') ? 'MITASH' : (r.cliente||'');
    serv.push({tipo:'Micropipeta', informe:r.informe, fecha:r.fecha, cliente:cli, sector:r.sector||'', id_equipo:r.id||'', marca:r.marca||'', modelo:r.modelo||'', revisar:r.alerta||''}); });
  ter.forEach(r=>{ if(!r.fecha||!r.informe) return;
    serv.push({tipo:'Termómetro', informe:r.informe, fecha:r.fecha, cliente:r.propio?'MITASH':(r.cliente||''), sector:/^\d/.test(r.sede||'')?'':(r.sede||''), /* "803- Falla en la sonda" es una nota, no una sede */ id_equipo:r.id||r.serie||'', serie:r.serie||'', marca:r.marca||'', modelo:r.modelo||''}); });
  serv.sort((a,b)=>a.fecha.localeCompare(b.fecha)||cmpInf(a.informe,b.informe));
  const eq = new Map();
  serv.forEach(s=>{ if(!s.id_equipo || !s.cliente) return; const k = s.tipo+'|'+nucleo(s.cliente)+'|'+limpioId(s.id_equipo); s.equipo = k;
    const e = eq.get(k) || {clave:k, tipo:s.tipo, cliente:s.cliente, id_equipo:s.id_equipo, trabajos:0};
    Object.assign(e, {ultima:s.fecha, ultimo_informe:s.informe, trabajos:e.trabajos+1}); ['sector','serie','marca','modelo'].forEach(c=>{ if(s[c]) e[c]=s[c]; }); eq.set(k,e); });
  const tanda = {}, kt = e => nucleo(e.cliente)+'|'+norm(e.sector||'');
  eq.forEach(e=>{ if(e.tipo==='Termómetro' && (!tanda[kt(e)] || e.ultima>tanda[kt(e)])) tanda[kt(e)] = e.ultima; });
  eq.forEach(e=>{ e.frecuencia_meses = e.tipo==='Termómetro' && /maip/i.test(e.cliente) ? 6 : 12;
    const d = new Date(e.ultima+'T12:00'); d.setMonth(d.getMonth()+e.frecuencia_meses); e.proxima = isoD(d);
    e.activo = e.tipo==='Termómetro' ? e.ultima >= sumarDias(tanda[kt(e)],-21) : e.ultima >= sumarDias(HOY,-730); });
  S.equipos = [...eq.values()]; S.servicios = serv;
}
async function cargarVis(){ if(LOCAL) return; const {data,error}=await sb.from('docs').select('id,data').eq('coleccion','visitas'); if(!error) S.vis=Object.fromEntries(data.map(d=>[d.id,d.data])); }
async function cargarTodo(){
  const local = f => fetch(f,{cache:'no-store'}).then(r=>r.json());
  const [inf, ter] = LOCAL ? await Promise.all([local('historial.json'), local('termometros.json')])
                           : await Promise.all([cargarTabla('informes'), cargarTabla('termometros')]);
  armarBase(inf, ter);
  if(LOCAL){ demo(); S.solOk=true; return; }
  await Promise.all([cargarTaller(),cargarSol(),cargarVis(),cargarCol('contactos'),cargarCol('internos')]);
}
// Colecciones simples en "docs": contactos de clientes y equipos internos de Mitash (patrones, termómetros de referencia...)
async function cargarCol(col){ if(LOCAL) return; const {data,error}=await sb.from('docs').select('id,data').eq('coleccion',col); if(!error) S[col]=Object.fromEntries(data.map(d=>[d.id,d.data])); }
async function docSet(col, id, d){ if(!LOCAL){ const {error}=await sb.from('docs').upsert({coleccion:col,id,data:d}); if(error){ alert('No se pudo guardar: '+error.message); return false; } } S[col][id]=d; return true; }
async function docDel(col, id){ if(!LOCAL){ const {error}=await sb.from('docs').delete().eq('coleccion',col).eq('id',id); if(error){ alert('No se pudo borrar: '+error.message); return; } } delete S[col][id]; }
const sinVacios = o =>Object.fromEntries(Object.entries(o).filter(([,v])=>v!=null && v!==''));
async function tallerInsert(filas){
  const docs = filas.map((f,i)=>({coleccion:'taller', id:'t'+Date.now()+'-'+i, data:sinVacios({...f, cargado:HOY, por:S.email||null})}));
  if(!LOCAL){ const {error}=await sb.from('docs').insert(docs); if(error){ alert('No se pudo guardar: '+error.message); return false; } }
  S.tallerDb.push(...docs.map(d=>deTaller({...d.data, id:d.id}))); return true; }
async function tallerUpdate(tids, cambios){
  if(!tids.length) return true;
  const L = S.tallerDb.filter(t=>tids.includes(t.tid));
  const docs = L.map(t=>{ const {tid, ...resto} = {...t, ...cambios}; return {coleccion:'taller', id:tid, data:sinVacios(resto)}; });
  if(!LOCAL){ const {error}=await sb.from('docs').upsert(docs); if(error){ alert('No se pudo guardar: '+error.message); return false; } }
  L.forEach(t=>Object.assign(t, cambios)); return true; }
async function visSet(id, d){ if(!LOCAL){ const {error}=await sb.from('docs').upsert({coleccion:'visitas',id,data:d}); if(error){ alert('No se pudo guardar: '+error.message); return false; } } S.vis[id]=d; return true; }
async function visDel(id){ if(!LOCAL){ const {error}=await sb.from('docs').delete().eq('coleccion','visitas').eq('id',id); if(error){ alert('No se pudo borrar: '+error.message); return; } } delete S.vis[id]; }
async function solUpdate(id, cambios){ const s=S.sol.find(x=>x.id===id); if(!s) return; Object.assign(s,cambios); if(!LOCAL){ const {error}=await sb.from('solicitudes').update(cambios).eq('id',id); if(error) alert('No se pudo guardar: '+error.message); } }

// ---------------------------------------------------------------- lógica
const memo = (k, fn) => { if(!S['_'+k] || S['_'+k].r!==S.r) S['_'+k]={r:S.r, v:fn()}; return S['_'+k].v; };
const clientes = () => memo('cli', () => [...new Set([...S.equipos.map(e=>e.cliente), ...S.tallerDb.map(t=>t.cliente)].filter(c=>c && c!=='MITASH'))].sort((a,b)=>a.localeCompare(b)));
const clienteSol = s => s.cliente_base || clientes().find(c=>mismoCli(c,s.cliente)) || s.cliente;
const itemsSol = s => Array.isArray(s.items) && s.items.length ? s.items : [];
const solIngresada = s => S.tallerDb.some(t=>t.solicitud===s.id);
const solAbierta = s => (s.estado==='nueva'||s.estado==='en curso') && !solIngresada(s);

// Taller: cada fila es un equipo. Las micros y termómetros se completan solos con el informe que aparece en el Drive
// (si no tienen ID, se les asigna el próximo informe de ese cliente, el más viejo primero).
function taller(){ return memo('tal', () => {
  const L = S.tallerDb.filter(t=>!(t.cerrado && !t.entregado)).map(t=>({...t, cat:CAT(t.tipo)}));
  const usados = new Set(L.filter(t=>t.informe).map(t=>CATN[t.cat][1]+'|'+t.informe));
  const libres = (t, extra) => S.servicios.filter(s => s.tipo===CATN[t.cat][1] && s.fecha>=t.fecha && !usados.has(s.tipo+'|'+s.informe) && extra(s))
    .sort((a,b)=>a.fecha.localeCompare(b.fecha)||cmpInf(a.informe,b.informe))[0];
  const asignar = (t,s) => { if(!s) return; usados.add(s.tipo+'|'+s.informe); t.auto = {informe:s.informe, fecha:s.fecha, id:s.id_equipo||s.serie||''}; };
  const pend = L.filter(t=>t.cat!=='R' && !t.informe && !t.entregado).sort((a,b)=>a.fecha.localeCompare(b.fecha)||a.tid.localeCompare(b.tid));
  pend.filter(t=>t.equipo).forEach(t=>asignar(t, libres(t, s=>s.equipo===t.equipo)));
  pend.filter(t=>!t.equipo && !t.auto && t.id_equipo).forEach(t=>{ const i=limpioId(t.id_equipo);
    asignar(t, libres(t, s=>mismoCli(s.cliente,t.cliente) && [s.id_equipo,s.serie].some(x=>x && limpioId(x)===i))); });
  pend.filter(t=>!t.equipo && !t.auto && !t.id_equipo).forEach(t=>asignar(t, libres(t, s=>mismoCli(s.cliente,t.cliente))));
  L.forEach(t=>{ t.inf = t.informe || (t.auto && t.auto.informe) || null; t.nombre = t.id_equipo || (t.auto && t.auto.id) || '';
    t.estado = t.entregado ? 'entregado' : (t.listo || t.inf) ? 'listo' : 'hacer'; });
  return L; }); }
const listos = () => taller().filter(t=>t.estado==='listo');
const porHacer = () => taller().filter(t=>t.estado==='hacer');
// lote = lo que entró junto (mismo cliente, día y tipo)
function lotes(L){ const m=new Map(); L.forEach(t=>{ const k=[t.cliente,t.sede,t.fecha,t.cat,t.solicitud||''].join('|'); m.has(k)||m.set(k,[]); m.get(k).push(t); });
  return [...m.values()].sort((a,b)=>a[0].fecha.localeCompare(b[0].fecha)); }
const agrupar = (L, fk) => { const m=new Map(); L.forEach(x=>{ const k=fk(x); m.has(k)||m.set(k,[]); m.get(k).push(x); }); return [...m.entries()]; };

// Recorridos (visitas): qué llevar, qué retirar y qué trabajo hacer en cada lugar
const visitas = () => Object.entries(S.vis).map(([id,v])=>({id,...v})).filter(v=>v.fecha);
// Viajes que se repiten (cronograma de Lucho): cada semana, cada 15 días o cada mes. Cada vez se marca hecha por separado.
const REPETIR = {'':'No se repite','7':'Todas las semanas','14':'Cada 15 días','mes':'Todos los meses'};
function repeticiones(v){ const out=[], hasta=sumarDias(HOY,60), desde=sumarDias(HOY,-7), hechas=v.hechas||[]; let f=v.fecha, n=0;
  while(f<=hasta && n<300){ if(f>=desde && !hechas.includes(f)) out.push({...v, id:v.id+'@'+f, base:v.id, fecha:f});
    n++; if(v.repetir==='mes'){ const d=new Date(v.fecha+'T12:00'); d.setMonth(d.getMonth()+n); f=isoD(d); } else f=sumarDias(v.fecha,(+v.repetir)*n); }
  return out; }
const proximas = () => memo('prox', () => visitas().flatMap(v=>v.repetir ? repeticiones(v) : (!v.hecho && v.fecha>=sumarDias(HOY,-7) ? [v] : [])).sort((a,b)=>a.fecha.localeCompare(b.fecha)||String(a.hora||'').localeCompare(String(b.hora||''))));
const llevarA = v => listos().filter(t=>mismoCli(t.cliente,v.cliente));
const retirarDe = v => S.sol.filter(s=>solAbierta(s) && (v.solicitud===s.id || mismoCli(clienteSol(s),v.cliente)));
const viajeDeSol = s => proximas().find(v=>v.solicitud===s.id);
const vencenEn = (cli, hasta) => S.equipos.filter(e=>e.activo && e.proxima && e.cliente!=='MITASH' && e.proxima.slice(0,7)<=hasta && e.proxima>=sumarDias(HOY,-240) && mismoCli(e.cliente,cli));
const viajePara = cli => proximas().find(v=>mismoCli(v.cliente,cli) && v.fecha>=HOY && v.fecha<=sumarDias(HOY,45));

// Vencimientos: equipos activos según la última calibración (Maipú termómetros 6 meses, el resto 1 año)
const vencimientos = () => memo('ven', () => S.equipos.filter(e=>e.activo && e.proxima && e.cliente && e.cliente!=='MITASH'));
const atrasado = e => e.proxima.slice(0,7) < MES && e.proxima >= sumarDias(HOY,-240);
const enTaller = e => taller().some(t=>t.estado!=='entregado' && (t.equipo===e.clave || (t.nombre && limpioId(t.nombre)===limpioId(e.id_equipo||e.serie))));

function yo(){ return PERFILES[(S.email||'').toLowerCase()] || ''; }

// ---------------------------------------------------------------- vistas
// Simple: 3 pestañas. El taller es la pantalla principal.
const TABS = [['taller','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/></svg>','Taller'],['recorridos','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7" cy="17.5" r="1.5"/><circle cx="17" cy="17.5" r="1.5"/></svg>','Viajes'],['vencimientos','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>','Vencimientos'],['pedidos','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H8l-4 4z"/></svg>','Pedidos']];
function render(){
  S.r++;
  const nPed = S.sol.filter(s=>s.estado==='nueva').length;
  const vista = S.view.split('/')[0]==='inicio' ? 'taller' : S.view.split('/')[0];
  $('#tabs').innerHTML = TABS.filter(([v])=>v!=='pedidos' || S.solOk).map(([v,i,t])=>`<a href="#${v}" class="${vista===v?'on':''}"><span class="i">${i}</span>${t}${v==='pedidos'&&nPed?`<span class="dot">${nPed}</span>`:''}</a>`).join('');
  const V = {taller:vTaller, recorridos:vRecorridos, contactos:vContactos, vencimientos:vVencimientos, pedidos:vPedidos, revisar:vRevisar}[vista] || vTaller;
  $('#main').innerHTML = V(); bind();
}
window.addEventListener('hashchange', () => { S.view = location.hash.slice(1)||'inicio'; render(); window.scrollTo(0,0); });

const resumenCat = L => ['M','T','R'].map(c=>[c,L.filter(t=>(t.cat||CAT(t.tipo))===c).length]).filter(([,n])=>n).map(([c,n])=>tagCat(c,n)).join(' ');

function tarjetaViaje(v){
  const lle = llevarA(v), ret = retirarDe(v), ven = vencenEn(v.cliente, v.fecha.slice(0,7)).filter(e=>!enTaller(e));
  const nRet = ret.reduce((n,s)=>n+Math.max(1,itemsSol(s).length),0);
  return `<div class="card trip ${v.fecha<=HOY?'hoy':''}">
    <div class="row"><div class="grow"><div class="when">${cuando(v.fecha)}${v.hora?' · '+esc(v.hora):''}${v.fecha<HOY?' · pendiente':''}</div>
      <div class="cli">${esc(v.cliente)}${v.sede?` <span class="muted" style="font-weight:500">· ${esc(v.sede)}</span>`:''}</div>
      <div class="small muted">${esc(v.tecnico||'Lucho')}${v.repetir?' · '+REPETIR[v.repetir].toLowerCase():''}</div></div>
      <button class="btn sm" data-evis="${esc(v.id)}">Editar</button></div>
    <div class="todo">
      ${v.tareas?`<div><div><b>Trabajo</b>${esc(v.tareas)}</div></div>`:''}
      ${lle.length?`<div><div><b>Llevar · listos para entregar</b>${resumenCat(lle)}<div class="small muted mono" style="margin-top:4px">${lle.map(t=>esc(t.nombre||t.inf||'')).filter(Boolean).slice(0,14).join(' · ')}</div></div></div>`:''}
      ${ret.length?`<div><div><b>Retirar · ${plural(nRet,'equipo')}</b><span class="small">${ret.map(s=>esc(itemsSol(s).map(i=>i.tipo).filter(Boolean).join(', ')||s.pedido||'pedido')).join(' · ')}</span></div></div>`:''}
      ${ven.length?`<div><div><b>Vencen ${ven.some(atrasado)?'o están atrasados':'este mes'}</b><span class="small">${resumenCat(ven.map(e=>({cat:CAT(e.tipo)})))} · aprovechar el viaje</span></div></div>`:''}
      ${!v.tareas && !lle.length && !ret.length && !ven.length?'<div><div class="small muted">Nada pendiente para este cliente.</div></div>':''}
    </div>
    <button class="btn ok" data-hvis="${esc(v.id)}">✓ Viaje hecho</button></div>`;
}

function vTaller(){
  const T = taller(), f = S.f;
  const L = T.filter(t=>t.estado===f.tal);
  const n = k => T.filter(t=>t.estado===k).length;
  const grupos = agrupar(L, t=>t.cliente).sort((a,b)=>b[1].length-a[1].length);
  // los 3 números son también los botones para cambiar de lista
  return `<div class="row"><div class="grow"><h1>Taller</h1></div><button class="btn pri" data-ning>+ Ingreso</button></div>
  <div class="stats" id="segtal" style="grid-template-columns:repeat(3,1fr);margin:12px 0 16px">${[['hacer','Para calibrar','acc'],['listo','Para entregar','ok'],['entregado','Entregados','']].map(([k,t,c])=>
    `<button class="stat ${c}" data-v="${k}" style="text-align:left;font:inherit;${f.tal===k?'outline:2px solid var(--acc);':'opacity:.75;'}"><div class="k">${t}</div><div class="v">${n(k)}</div></button>`).join('')}</div>
  ${grupos.length ? grupos.map(([c,X])=>{ const v = f.tal==='listo' && viajePara(c);
      return `<div class="card"><div class="row"><div class="grow cli">${esc(c)}</div>${f.tal!=='listo' ? '' : v ? `<span class="tag acc">Viaje ${cuando(v.fecha).toLowerCase()} · ${esc(v.tecnico||'Lucho')}</span>` : `<button class="btn sm" data-nvis-cli="${esc(c)}">Agendar entrega</button>`}</div>${lotes(X).map(lote).join('')}</div>`; }).join('')
    : `<div class="card flat empty">${f.tal==='hacer'?'No hay nada para calibrar.':f.tal==='listo'?'No hay nada listo para entregar.':'Sin entregas en los últimos 2 meses.'}</div>`}`;
}
function lote(X){
  const t0 = X[0], c = t0.cat, est = t0.estado;
  const ids = X.map(t=>t.tid).join(',');
  const desc = c==='R' ? esc(t0.tipo + (t0.detalle?' · '+t0.detalle:'')) : '';
  return `<div class="lote"><div class="row"><div class="grow">${tagCat(c, X.length)} <span class="small muted">${t0.sede?esc(t0.sede)+' · ':''}entró ${fmt(t0.fecha)}</span>
      ${desc?`<div class="small" style="margin-top:4px">${desc}</div>`:''}</div>
    ${est==='hacer'?`<button class="btn sm" data-acc="listo" data-ids="${ids}">✓ ${X.length>1?'Todo listo':'Listo'}</button>`
      : est==='listo'?`<button class="btn sm ok" data-acc="entregado" data-ids="${ids}">${X.length>1?'Entregar todo':'Entregado'}</button>`
      : `<span class="small muted">entregado ${fmt(t0.entregado)}</span><button class="btn sm ghost" data-acc="deshacer" data-ids="${ids}">Deshacer</button>`}</div>
    ${(() => { const sin = X.filter(t=>!t.nombre && !t.inf && c!=='R'); const con = c==='R' && X.length===1 ? [] : X.filter(t=>!sin.includes(t));
      return (con.length?`<div class="items">${con.map(chipItem(c,est)).join('')}</div>`:'') +
        (sin.length>1?`<div class="small muted" style="margin:6px 0 2px">${sin.length===X.length?sin.length+' sin ID':'+ '+sin.length+' sin ID'} (se completan con el informe)</div>`:''); })()}
  </div>`;
}
// cada equipo es solo texto (ID e informe); el botón va uno por grupo
const chipItem = (c, est) => t => `<span class="it ${t.estado!=='hacer'?'listo':''}" style="padding-right:9px" title="${t.inf?'Informe '+esc(t.inf):''}">
      <span class="mono">${esc(t.nombre || (c==='R'?t.tipo:'sin ID'))}</span>${t.inf?`<span class="small muted mono">${esc(t.inf)}</span>`:''}</span>`;
async function accionTaller(ids, acc){
  const L = taller().filter(t=>ids.includes(t.tid)); if(!L.length) return;
  if(acc==='entregado' && L.length>1 && !confirm(`¿Se entregaron los ${L.length} equipos de ${L[0].cliente}?`)) return;
  const ok = acc==='listo' ? await tallerUpdate(ids,{listo:HOY})
    : acc==='entregado' ? (await Promise.all(L.map(t=>tallerUpdate([t.tid],{entregado:HOY, cerrado:true, informe:t.inf||null})))).every(Boolean)
    : await tallerUpdate(ids,{entregado:null, cerrado:false});
  if(ok){ toast(acc==='listo'?'Marcado como listo':acc==='entregado'?'Marcado como entregado':'Listo, vuelve a "Listos"'); render(); }
}

function vRecorridos(){
  const P = proximas(), hechos = visitas().filter(v=>v.hecho).sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,10);
  return `<div class="row"><div class="grow"><h1>Viajes</h1></div><button class="btn pri" data-nvis>+ Viaje</button></div>

  ${P.length ? agrupar(P, v=>v.fecha).map(([f,V])=>V.map(tarjetaViaje).join('')).join('') : `<div class="card flat empty">No hay viajes cargados.<br><span class="small">Cargá los recorridos de Lucho con "+ Viaje".</span></div>`}
  ${hechos.length?`<details class="card flat"><summary class="click"><b>Viajes hechos</b> <span class="muted">· últimos ${hechos.length}</span></summary><div class="list" style="margin-top:8px">${hechos.map(v=>`<div><div class="grow"><b>${esc(v.cliente)}</b> <span class="small muted">${fmtA(v.fecha)} · ${esc(v.tecnico||'')}</span><div class="small muted">${esc(v.resumen||v.tareas||'')}</div></div><button class="btn sm" data-evis="${esc(v.id)}">Ver</button></div>`).join('')}</div></details>`:''}`;
}

  .sort((a,b)=>a.proxima.localeCompare(b.proxima));

  if(id) $('#borint').onclick = async () => { if(confirm('¿Borrar este equipo interno?')){ await docDel('internos', id); cerrar(); render(); } };

// Contactos de clientes (para los avisos de próxima calibración; el bot también los usa)
const contactos = () => Object.entries(S.contactos).map(([id,x])=>({id,...x})).sort((a,b)=>String(a.cliente).localeCompare(String(b.cliente)));
// número para wa.me: celulares de Argentina como 549 + área + número (sin 0 ni 15)
const waNum = t => { let d = String(t||'').replace(/\D/g,''); if(!d) return '';
  if(d.startsWith('54')) d = d.slice(2); d = d.replace(/^0/,'').replace(/^9/,'');
  if(d.length===12 && d.slice(2,4)==='15') d = d.slice(0,2)+d.slice(4);   // 11 15 5555-5555
  return '549'+d; };
const contactoDe = c =>contactos().find(x=>mismoCli(x.cliente,c) && x.telefono);
function vContactos(){
  const L = contactos();
  return `<p><a href="#vencimientos">← Vencimientos</a></p><div class="row"><div class="grow"><h1>Contactos de clientes</h1></div><button class="btn pri" data-ncon>+ Contacto</button></div>
  <p class="sub">A quién avisar de cada cliente cuando le toca la calibración.</p>
  ${L.length ? `<div class="card"><div class="list">${L.map(x=>`<div class="click" data-econ="${esc(x.id)}"><div class="grow"><b>${esc(x.cliente)}</b>${x.sede?` <span class="muted">· ${esc(x.sede)}</span>`:''}
      <div class="small muted">${esc([x.nombre,x.telefono,x.email].filter(Boolean).join(' · '))}</div></div>${x.avisos==='no'?'<span class="tag">sin avisos</span>':''}</div>`).join('')}</div></div>`
    : '<div class="card flat empty">Todavía no hay contactos cargados.</div>'}`;
}
function formContacto(id){
  const x = id ? S.contactos[id] : {};

function vVencimientos(){
  const meses = [MES, sumarMeses(MES,1), sumarMeses(MES,2)];
  const sel = S.f.ven;
  const chipInt = `<button class="chip ${sel==='int'?'on':''}" data-v="int">Equipos internos${internosAvisar().length?' · '+internosAvisar().length:''}</button>`;
  if(sel==='int') return `<h1>Vencimientos</h1><p class="sub">Próximas calibraciones.</p>
    <div class="chips" id="chven"><button class="chip" data-v="atr">Atrasados</button>${meses.map(m=>`<button class="chip" data-v="${m}">${cap(mesTxt(m))}</button>`).join('')}${chipInt}</div>${vInternos()}`;
  const E = vencimientos().filter(e => sel==='atr' ? atrasado(e) : e.proxima.slice(0,7)===sel);
  const nAtr = vencimientos().filter(atrasado).length;
  const grupos = agrupar(E, e=>e.cliente+'\u0000'+(e.sector||'')).sort((a,b)=>b[1].length-a[1].length);
  return `<h1>Vencimientos</h1><p class="sub">Próximas calibraciones de cada cliente, según la última que hicimos. <a href="#contactos">Contactos de clientes</a></p>
  <div class="chips" id="chven"><button class="chip ${sel==='atr'?'on':''}" data-v="atr">Atrasados · ${nAtr}</button>${meses.map(m=>`<button class="chip ${sel===m?'on':''}" data-v="${m}">${cap(mesTxt(m))} · ${vencimientos().filter(e=>e.proxima.slice(0,7)===m).length}</button>`).join('')}${chipInt}</div>
  ${grupos.length ? grupos.map(([k,X])=>{ const [c,sede]=k.split('\u0000'); const v=viajePara(c); const nt=X.filter(enTaller).length;
    return `<div class="card"><div class="row"><div class="grow"><div class="cli">${esc(c)}${sede?` <span class="muted" style="font-weight:500">· ${esc(sede)}</span>`:''}</div>
      <div style="margin-top:6px">${resumenCat(X.map(e=>({cat:CAT(e.tipo)})))}${nt?` <span class="tag acc">${nt} ya en el taller</span>`:''}${v?` <span class="tag acc">${cuando(v.fecha)}</span>`:''}</div></div></div>
      <details class="more"><summary>Ver equipos</summary><div class="items">${X.sort((a,b)=>String(a.id_equipo).localeCompare(String(b.id_equipo),undefined,{numeric:true})).map(e=>`<span class="it click ${enTaller(e)?'listo':''}" data-eq="${esc(e.clave)}" style="padding-right:9px"><span class="mono">${esc(e.id_equipo||e.serie||'?')}</span><span class="small muted">${fmt(e.proxima)}</span></span>`).join('')}</div></details>
      <div class="row" style="margin-top:10px"><button class="btn sm" data-aviso="${esc(k)}">Avisar al cliente</button>${v?'':`<button class="btn sm" data-nvis-cli="${esc(c)}" data-nvis-sede="${esc(sede)}">Agendar visita</button>`}</div></div>`; }).join('')
    : `<div class="card flat empty">No vence nada ${sel==='atr'?'atrasado':'en '+mesTxt(sel)}.</div>`}`;
}
function mensajeAviso(c, sede, E, mes){
  const ids = E.map(e=>e.id_equipo||e.serie).filter(Boolean); const lista = ids.slice(0,25).join(', ')+(ids.length>25?` y ${ids.length-25} más`:'');
  return `Hola! Te escribimos de Mitash. ${mes<MES?'Ya está vencida':'En '+mesTxt(mes)+' vence'} la calibración de ${plural(E.length,'equipo')} de ${c}${sede?` (sede ${sede})`:''}: ${lista}.\n`+
    `Para coordinar, podés completar este formulario: ${linkForm(c,sede)}`;
}
function avisar(k){
  const [c,sede]=k.split('\u0000'); const sel=S.f.ven;
  const E = vencimientos().filter(e=>e.cliente===c && (e.sector||'')===sede && (sel==='atr'?atrasado(e):e.proxima.slice(0,7)===sel));
  const txt = mensajeAviso(c, sede, E, sel==='atr'?sumarMeses(MES,-1):sel);
  const ult = contactoDe(c) || S.sol.filter(s=>mismoCli(clienteSol(s),c) && s.telefono)[0]; const tel = ult ? waNum(ult.telefono) : '';
  hoja(`<div class="hd"><h2>Avisar a ${esc(c)}</h2><button class="ibtn" data-cerrar aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <p class="small muted">El mensaje lo mandás vos. El sistema no le escribe solo a los clientes.</p>
    <form class="f"><textarea rows="7" id="txtav">${esc(txt)}</textarea></form>
    <div class="row" style="margin-top:12px"><button class="btn pri" id="copav">Copiar mensaje</button>
    <a class="btn" target="_blank" rel="noopener" href="https://wa.me/${tel}?text=${encodeURIComponent(txt)}">Abrir WhatsApp${tel?'':' (elegís el contacto)'}</a></div>`);
  $('#copav').onclick = async () => { try{ await navigator.clipboard.writeText($('#txtav').value); toast('Mensaje copiado'); }catch(e){ $('#txtav').select(); } };
}

    <button class="btn sm pri" data-copiar="${PUBLIC_FORM}">Copiar</button><a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('Hola! Para pedir un servicio a Mitash completá este formulario: '+PUBLIC_FORM)}">WhatsApp</a></div></div>
  <div class="seg" id="segped"><button data-v="abiertos" class="${ab?'on':''}">Para resolver · ${S.sol.filter(solAbierta).length}</button><button data-v="todos" class="${ab?'':'on'}">Todos</button></div>

function tarjetaPedido(s){
  const items = itemsSol(s), cli = clienteSol(s), v = viajeDeSol(s) || viajePara(cli);
  const porCat = agrupar(items, i=>CAT(i.tipo));
  return `<div class="card"><div class="row"><div class="grow"><div class="cli">${esc(s.cliente)}${s.sede?` <span class="muted" style="font-weight:500">· ${esc(s.sede)}</span>`:''}</div>
      <div class="small muted">${fmtA(String(s.creada).slice(0,10))} · ${esc([s.contacto,s.telefono,s.email].filter(Boolean).join(' · ')||'sin contacto')}</div></div>
      <span class="tag ${s.estado==='nueva'?'bad':s.estado==='hecha'?'ok':'acc'}">${solIngresada(s)?'en el taller':esc(s.estado)}</span></div>
    <div style="margin:10px 0 4px">${porCat.map(([c,X])=>tagCat(c,X.length)).join(' ')} <span class="small muted">${esc(s.pedido||'')}</span></div>
    ${items.length?`<details class="more"><summary>Ver equipos</summary><div class="items">${items.map(i=>`<span class="it" style="padding-right:9px"><span class="mono">${esc(i.id||('SN '+(i.serie||'?')))}</span><span class="small muted">${esc(i.servicio||'')}</span></span>`).join('')}</div></details>`:''}
    ${s.direccion?`<div class="small" style="margin-top:6px"><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.direccion)}">${esc(s.direccion)}</a></div>`:''}
    ${s.detalle?`<div class="small muted" style="margin-top:6px">“${esc(s.detalle)}”</div>`:''}
    ${cli!==s.cliente?`<div class="small muted" style="margin-top:6px">Es el cliente <b>${esc(cli)}</b> de la base.</div>`:''}
    ${v?`<div style="margin-top:8px"><span class="tag acc">se retira ${cuando(v.fecha)}</span></div>`:''}
    <div class="row" style="margin-top:12px">
      ${solAbierta(s)&&items.length?`<button class="btn sm pri" data-ingsol="${s.id}">Ingresó al taller</button>`:''}
      ${solAbierta(s)&&!v?`<button class="btn sm" data-retsol="${s.id}">Retirar en viaje</button>`:''}
      ${s.telefono?`<a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/${esc(String(s.telefono).replace(/\D/g,''))}">WhatsApp</a>`:''}
      ${solAbierta(s)?`<button class="btn sm ghost" data-descsol="${s.id}">Descartar</button>`:''}</div></div>`;
}
async function ingresarSolicitud(id, sinPreguntar){
  const s = S.sol.find(x=>x.id===id); if(!s) return false;
  const items = itemsSol(s), cli = clienteSol(s);
  if(!sinPreguntar && !confirm(`¿Entraron al taller los ${plural(items.length,'equipo')} de ${cli}?`)) return false;
  const filas = items.map(i=>{ const e = S.equipos.find(e=>mismoCli(e.cliente,cli) && CAT(e.tipo)===CAT(i.tipo) && [e.id_equipo,e.serie].some(x=>x && [i.id,i.serie].some(y=>y && limpioId(x)===limpioId(y))));
    return {fecha:HOY, cliente:cli, sede:s.sede||null, tipo:CAT(i.tipo)==='R'?i.tipo:CATN[CAT(i.tipo)][1], id_equipo:i.id||null, serie:i.serie||null,
      equipo:e?e.clave:null, pedido:i.servicio||null, detalle:[i.marca,s.detalle].filter(Boolean).join(' · ')||null, solicitud:s.id}; });
  if(!await tallerInsert(filas)) return false;
  await solUpdate(id,{estado:'en curso'}); return true;
}

function hoja(html){ $('#ov').innerHTML = `<div class="ov" id="ovb"><div class="sheet">${html}</div></div>`;
  $('#ovb').onclick = e => { if(e.target.id==='ovb' || e.target.closest('[data-cerrar]')) cerrar(); }; }
const cerrar = () => { $('#ov').innerHTML=''; };
document.addEventListener('keydown', e => { if(e.key==='Escape') cerrar(); });
const dlClientes = () => `<datalist id="dlcli">${clientes().map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`;

function formIngreso(){
  hoja(`<div class="hd"><h2>Ingreso al taller</h2><button class="ibtn" data-cerrar aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <form class="f" id="fing">
    <label>Cliente<input name="cliente" list="dlcli" required autocomplete="off"></label>${dlClientes()}
    <div class="pick">${['M','T','R'].map((c,i)=>`<label><input type="radio" name="cat" value="${c}" ${i===0?'checked':''}> ${CATN[c][0]} ${CATN[c][2]}</label>`).join('')}</div>
    <div class="two"><label>Cantidad<input name="cant" type="number" min="1" max="200" value="1" required></label><label>Sede (si tiene)<input name="sede"></label></div>
    <label id="lequipo" hidden>Qué equipo<input name="equipo" placeholder="Ej.: centrífuga Rolco, estufa"></label>
    <label>IDs <span style="font-weight:500">(opcional, uno por renglón. Si no los ponés, se completan solos con los informes)</span><textarea name="ids" rows="3"></textarea></label>
    <label>Detalle (opcional)<input name="detalle" placeholder="Ej.: no enciende · los trajo Lucho"></label>
    <label>Fecha de ingreso<input name="fecha" type="date" value="${HOY}"></label>
    <div class="err" id="ierr"></div><button class="btn pri" style="justify-content:center">Guardar ingreso</button></form>`);
  const fm = $('#fing');
  fm.querySelectorAll('[name=cat]').forEach(r=>r.onchange=()=>{ $('#lequipo').hidden = fm.cat.value!=='R'; });
  fm.onsubmit = async e => { e.preventDefault(); const d = Object.fromEntries(new FormData(fm).entries());
    const cli = d.cliente.trim(), ids = d.ids.split('\n').map(x=>x.trim()).filter(Boolean), n = Math.max(ids.length, +d.cant||1);
    if(!cli){ $('#ierr').textContent='Falta el cliente.'; return; }
    if(d.cat==='R' && !d.equipo.trim()){ $('#ierr').textContent='Escribí qué equipo es.'; return; }
    const tipo = d.cat==='R' ? d.equipo.trim() : CATN[d.cat][1];
    const filas = Array.from({length:n}, (_,i)=>{ const id = ids[i]||null;
      const e = id && S.equipos.find(e=>mismoCli(e.cliente,cli) && CAT(e.tipo)===d.cat && [e.id_equipo,e.serie].some(x=>x && limpioId(x)===limpioId(id)));
      return {fecha:d.fecha||HOY, cliente:cli, sede:d.sede.trim()||null, tipo, id_equipo:id, equipo:e?e.clave:null, pedido:d.cat==='R'?'Reparación':'Calibración', detalle:d.detalle.trim()||null}; });
    if(await tallerInsert(filas)){ cerrar(); S.f.tal='hacer'; S.f.cat=''; toast('Ingreso guardado'); location.hash==='#taller' ? render() : (location.hash='taller'); } };
}

    <div class="err" id="verr"></div>

    if(!d.cliente.trim()||!d.fecha){ $('#verr').textContent='Poné cliente y fecha.'; return; }
    const nid = id || 'v'+Date.now();
    const x = Object.assign({}, id?S.vis[id]:{}, pre&&pre.solicitud?{solicitud:pre.solicitud}:{}, {cliente:d.cliente.trim(), fecha:d.fecha, hora:d.hora, tecnico:d.tecnico, sede:d.sede.trim(), tareas:d.tareas.trim(), repetir:d.repetir||''});
    if(await visSet(nid, x)){ cerrar(); toast('Viaje guardado'); render(); } };
  if(id) $('#borvis').onclick = async () => { if(confirm('¿Borrar este viaje?')){ await visDel(id); cerrar(); render(); } };

async function viajeHecho(id){
  const [base, fRep] = id.split('@'); const v = {...S.vis[base], id, fecha:fRep||S.vis[base].fecha}; const lle = llevarA(v), ret = retirarDe(v);
  const partes = [];
  if(lle.length && confirm(`¿Entregaste los ${plural(lle.length,'equipo')} listos de ${v.cliente}?`)){
    await Promise.all(lle.map(t=>tallerUpdate([t.tid],{entregado:HOY, cerrado:true, informe:t.inf||null}))); partes.push(`entregó ${lle.length}`); }
  for(const s of ret){ if(itemsSol(s).length && confirm(`¿Retiraste los ${plural(itemsSol(s).length,'equipo')} del pedido de ${s.cliente}? (pasan al taller)`)){ if(await ingresarSolicitud(s.id,true)) partes.push(`retiró ${itemsSol(s).length}`); } }
  const resumen = [v.tareas, ...partes].filter(Boolean).join(' · ');
  await visSet(base, fRep ? {...S.vis[base], hechas:[...(S.vis[base].hechas||[]), fRep], ultimo:{fecha:fRep, resumen}} : {...S.vis[base], hecho:true, resumen});
  toast('Viaje marcado como hecho'); render();
}

function buscar(){
  hoja(`<div class="hd"><h2>Buscar equipo</h2><button class="ibtn" data-cerrar aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <form class="f" onsubmit="return false"><input id="bq" type="search" placeholder="ID, n° de serie o cliente" autocomplete="off"></form><div class="list" id="bres" style="margin-top:8px"></div>`);
  const q = $('#bq'); q.focus();
  q.oninput = () => { const t = norm(q.value).trim(); if(t.length<2){ $('#bres').innerHTML=''; return; }
    const R = S.equipos.filter(e=>norm([e.id_equipo,e.serie,e.cliente,e.sector,e.marca].join(' ')).includes(t)).slice(0,40);
    const Tl = taller().filter(x=>x.estado!=='entregado' && norm([x.nombre,x.inf,x.cliente,x.tipo].join(' ')).includes(t)).slice(0,10);
    $('#bres').innerHTML = Tl.map(x=>`<div><div class="grow">${tagCat(x.cat)} <b class="mono">${esc(x.nombre||x.tipo)}</b> <span class="small muted">${esc(x.cliente)}</span></div><span class="tag ${x.estado==='listo'?'ok':'acc'}">${x.estado==='listo'?'listo para entregar':'en el taller'}</span></div>`).join('') +
      (R.map(e=>`<div class="click" data-eq="${esc(e.clave)}"><div class="grow"><span class="small muted">${CATN[CAT(e.tipo)][1]}</span> <b class="mono">${esc(e.id_equipo||e.serie)}</b> <span class="small muted">${esc(e.cliente||'')}${e.sector?' · '+esc(e.sector):''}</span></div><span class="small muted">${fmtA(e.ultima)}</span></div>`).join('') || (Tl.length?'':'<div class="muted">No encontré nada.</div>'));
    $$('#bres [data-eq]').forEach(el=>el.onclick=()=>fichaEquipo(el.dataset.eq)); };
}

  hoja(`<div class="hd"><h2>Más</h2><button class="ibtn" data-cerrar aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div class="menu">
    <button id="mbus">Buscar equipo</button>
        <a href="#contactos" data-cerrar>Contactos de clientes</a>

function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }

// ---------------------------------------------------------------- eventos
function bind(){
  const seg = (sel,k) => { const el=$(sel); if(el) el.onclick = e => { const b=e.target.closest('[data-v]'); if(b){ S.f[k]=b.dataset.v; render(); } }; };
  seg('#segtal','tal'); seg('#chcat','cat'); seg('#chven','ven'); seg('#segped','ped');
  $$('[data-tal]').forEach(el=>el.addEventListener('click',()=>{ S.f.tal=el.dataset.tal; }));
  $$('[data-ir-tal]').forEach(el=>el.onclick = () => { S.f.tal=el.dataset.irTal; location.hash='taller'; });
  $$('[data-acc]').forEach(el=>el.onclick = e => { e.stopPropagation(); accionTaller(el.dataset.ids.split(','), el.dataset.acc); });
  $$('[data-ning]').forEach(el=>el.onclick = formIngreso);
  $$('[data-nvis]').forEach(el=>el.onclick = () => formViaje(null));
  $$('[data-nvis-cli]').forEach(el=>el.onclick = () => formViaje(null, {cliente:el.dataset.nvisCli, sede:el.dataset.nvisSede||''}));
  $$('[data-evis]').forEach(el=>el.onclick = () => formViaje(el.dataset.evis));
  $$('[data-hvis]').forEach(el=>el.onclick = () => viajeHecho(el.dataset.hvis));
  $$('[data-eq]').forEach(el=>el.onclick = () => fichaEquipo(el.dataset.eq));
  $$('[data-aviso]').forEach(el=>el.onclick = () => avisar(el.dataset.aviso));
  $$('[data-nint]').forEach(el=>el.onclick = () => formInterno(null));
  $$('[data-eint]').forEach(el=>el.onclick = () => formInterno(el.dataset.eint));
  $$('[data-ncon]').forEach(el=>el.onclick = () => formContacto(null));
  $$('[data-econ]').forEach(el=>el.onclick = () => formContacto(el.dataset.econ));
  $$('[data-ingsol]').forEach(el=>el.onclick = async () => { if(await ingresarSolicitud(+el.dataset.ingsol)){ toast('Pasó al taller'); render(); } });
  $$('[data-retsol]').forEach(el=>el.onclick = () => { const s=S.sol.find(x=>x.id===+el.dataset.retsol);
    formViaje(null, {cliente:clienteSol(s), sede:s.sede||'', tareas:'Retirar equipos del pedido', solicitud:s.id}); });
  $$('[data-descsol]').forEach(el=>el.onclick = async () => { if(confirm('¿Descartar este pedido?')){ await solUpdate(+el.dataset.descsol,{estado:'descartada'}); render(); } });
  $$('[data-copiar]').forEach(el=>el.onclick = async () => { try{ await navigator.clipboard.writeText(el.dataset.copiar); toast('Link copiado'); }catch(e){ prompt('Copiá el link:', el.dataset.copiar); } });
}
$('#bbuscar').onclick = buscar; $('#bmenu').onclick = menu;

// ---------------------------------------------------------------- arranque
function vLogin(msg){
  ['header.top','#main','#tabs'].forEach(s=>$(s).hidden=true);
  const L=$('#login'); L.hidden=false;
  L.innerHTML = `<form class="f" id="flogin"><div class="logo" style="font-size:22px;margin-bottom:6px"><i>M</i>Mitash</div><p class="muted" style="margin:0 0 6px">Entrá con tu mail y contraseña.</p>
    <label>Email<input id="lemail" type="email" autocomplete="username" required></label>
    <label>Contraseña<input id="lpass" type="password" autocomplete="current-password" required></label>
    <div class="err" id="lerr">${esc(msg||'')}</div><button class="btn pri" style="justify-content:center">Entrar</button><p class="small muted" style="margin:0;text-align:center">${VERSION}</p></form>`;
  $('#flogin').onsubmit = async e => { e.preventDefault(); $('#lerr').textContent='Entrando…'; let error;
    try{ ({error} = await conTiempo(sb.auth.signInWithPassword({email:$('#lemail').value.trim(), password:$('#lpass').value}),15000)); }catch(x){ error=x; }
    if(error){ $('#lerr').textContent = error.message==='tiempo' ? 'No responde el servidor. Revisá internet.' : 'Email o contraseña incorrectos.'; return; }
    L.hidden=true; arrancar(); };
}
async function arrancar(){
  ['header.top','#main','#tabs'].forEach(s=>$(s).hidden=false);
  $('#main').innerHTML = '<div class="empty">Cargando…</div>';
  if(!LOCAL){ const {data:{session}} = await sb.auth.getSession(); S.email = session ? session.user.email : '';
    const re = (fn) => async () => { await fn(); if(!$('#ov').innerHTML) render(); };
    sb.channel('cambios').on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'coleccion=eq.taller'}, re(cargarTaller))
      .on('postgres_changes',{event:'*',schema:'public',table:'solicitudes'}, re(cargarSol))
      .on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'coleccion=eq.visitas'}, re(cargarVis)).subscribe(); }
  try{ await cargarTodo(); }catch(e){ $('#main').innerHTML = `<div class="banner">No se pudieron cargar los datos (${esc(e.message||e)}). Revisá la conexión y recargá.</div>`; return; }
  if(!S.equipos.length){ $('#main').innerHTML = '<div class="banner">Todavía no se cargó la base de equipos. Se carga sola desde la compu de casa en unos minutos.</div>'; return; }
  render();
}

async function init(){
  if(LOCAL){ S.email=''; return arrancar(); }
  if(!sb){ $('#main').hidden=false; $('#main').innerHTML='<div class="banner">No se pudo conectar. Revisá internet y recargá.</div>'; return; }
  let session=null; try{ ({data:{session}} = await conTiempo(sb.auth.getSession(),5000)); }catch(e){}
  session ? arrancar() : vLogin();
}
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
init();
})();
