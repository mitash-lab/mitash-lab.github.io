<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistema Mitash</title>
<meta name="theme-color" content="#12292B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mitash">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap">
<style>
/* Layout: barra lateral oscura fija + área de trabajo; en teléfono la barra pasa arriba y se desliza. */
:root{
  --bg:#F3F1EC; --surface:#FFFFFF; --surface-2:#F8F7F3; --line:#E0DCD3; --line-soft:#ECE9E2;
  --fg:#1B1D1F; --muted:#585E64; --accent:#0F5C63; --accent-fg:#FFFFFF; --accent-soft:#DDEBEC;
  --nav:#12292B; --nav-fg:#E8ECEA; --nav-muted:#A9B8B6; --nav-active:#1F4A4D;
  --ok-bg:#E3F1E7; --ok-fg:#1E5E33; --warn-bg:#FDF1DE; --warn-fg:#8A4B08; --bad-bg:#FBE9E7; --bad-fg:#9A1C12; --na-bg:#EFEDE8; --na-fg:#585E64;
  --bar:#0F5C63;
  --f-sans:'IBM Plex Sans',system-ui,sans-serif; --f-cond:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111617; --surface:#1A2123; --surface-2:#161C1E; --line:#2E393B; --line-soft:#242D2F;
  --fg:#E7ECEB; --muted:#A3AEAD; --accent:#5FB3B9; --accent-fg:#0B1E20; --accent-soft:#183A3D;
  --nav:#0B1A1B; --nav-fg:#E2E9E8; --nav-muted:#8FA3A1; --nav-active:#1B3B3E;
  --ok-bg:#16301F; --ok-fg:#8FD4A5; --warn-bg:#3A2A12; --warn-fg:#F2C27A; --bad-bg:#3B1A17; --bad-fg:#F2A399; --na-bg:#242B2D; --na-fg:#A3AEAD;
  --bar:#5FB3B9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111617; --surface:#1A2123; --surface-2:#161C1E; --line:#2E393B; --line-soft:#242D2F;
  --fg:#E7ECEB; --muted:#A3AEAD; --accent:#5FB3B9; --accent-fg:#0B1E20; --accent-soft:#183A3D;
  --nav:#0B1A1B; --nav-fg:#E2E9E8; --nav-muted:#8FA3A1; --nav-active:#1B3B3E;
  --ok-bg:#16301F; --ok-fg:#8FD4A5; --warn-bg:#3A2A12; --warn-fg:#F2C27A; --bad-bg:#3B1A17; --bad-fg:#F2A399; --na-bg:#242B2D; --na-fg:#A3AEAD;
  --bar:#5FB3B9; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100%}
nav.side{width:224px;flex-shrink:0;background:var(--nav);color:var(--nav-fg);padding:24px 14px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-family:var(--f-cond);font-size:24px;letter-spacing:.02em;padding:0 10px 18px}
.brand small{display:block;font-family:var(--f-sans);font-size:12px;font-weight:400;color:var(--nav-muted);letter-spacing:0}
.navgroup{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--nav-muted);padding:16px 10px 6px}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--nav-fg);padding:10px;border-radius:8px;cursor:pointer;min-height:40px}
.navbtn:hover{background:rgba(255,255,255,.06)}
.navbtn[aria-current="page"]{background:var(--nav-active);font-weight:600}
.navbtn .soon{margin-left:auto;font-size:10px;color:var(--nav-muted);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:1px 6px}
.navbtn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;min-width:0;padding-block:28px 48px;padding-inline:clamp(16px,3vw,40px);display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px}
.head h1{margin:0;font-family:var(--f-cond);font-size:30px;font-weight:600;flex:1;min-width:200px;text-wrap:balance}
.eyebrow{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.small{min-height:32px;padding:0 10px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.card h2{margin:0 0 12px;font-size:16px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-family:var(--f-mono);font-size:30px;font-weight:500;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .n{font-size:12px;color:var(--muted)}
.kpi.bad .v{color:var(--bad-fg)} .kpi.warn .v{color:var(--warn-fg)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media (max-width:980px){.grid2{grid-template-columns:minmax(0,1fr)}}
.chip{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:500;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok-fg)} .chip.warn{background:var(--warn-bg);color:var(--warn-fg)} .chip.bad{background:var(--bad-bg);color:var(--bad-fg)} .chip.na{background:var(--na-bg);color:var(--na-fg)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.empty{color:var(--muted);font-style:italic}
.missing{color:var(--warn-fg);font-size:12px;border:1px dashed var(--warn-fg);border-radius:6px;padding:1px 6px;white-space:nowrap}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:880px}
table.wide{min-width:1180px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
th{font-size:12px;font-weight:500;color:var(--muted);background:var(--surface-2);position:sticky;top:0;white-space:nowrap}
td.mono,.mono{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--surface-2)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{min-height:40px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface)}
.field textarea{min-height:70px;resize:vertical}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end}
.bars .b i{display:block;width:100%;max-width:34px;background:var(--bar);border-radius:4px 4px 0 0;min-height:2px}
.bars .b span{font-size:11px;color:var(--muted)} .bars .b em{font-style:normal;font-size:11px;font-family:var(--f-mono)}
.list .row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);align-items:center}
.list .row:last-child{border-bottom:0}
.list .row .grow{flex:1;min-width:0}
.banner{border:1px solid var(--warn-fg);background:var(--warn-bg);color:var(--warn-fg);border-radius:10px;padding:10px 14px;font-size:13px}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:21;overflow-y:auto;padding:24px 24px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.drawer h2{margin:0;font-family:var(--f-cond);font-size:24px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:minmax(0,1fr)}}
.check{display:flex;align-items:center;gap:8px;min-height:40px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;font-size:13px}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.month h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between}
.soonbox ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{min-height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
@media (max-width:760px){
  .app{flex-direction:column}
  nav.side{width:auto;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:12px 16px;gap:4px;align-items:center}
  .brand{padding:0 12px 0 0;font-size:20px} .brand small,.navgroup{display:none}
  .navbtn{width:auto;white-space:nowrap} .navbtn .soon{display:none}
}
.userbox{margin-top:auto;padding:16px 10px 0;border-top:1px solid rgba(255,255,255,.12);font-size:12px;color:var(--nav-muted);display:flex;flex-direction:column;gap:6px;overflow-wrap:anywhere}
.userbox .navbtn{padding:6px 0;min-height:32px;color:var(--nav-muted)}
.login{min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--nav)}
.login form{background:var(--surface);border-radius:14px;padding:28px 24px;width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
.login h1{margin:0;font-family:var(--f-cond);font-size:28px}
.login .err{color:var(--bad-fg);font-size:13px;min-height:18px}
@media (max-width:760px){.userbox{margin:0;padding:0 0 0 8px;border:0;flex-direction:row;align-items:center;white-space:nowrap}.userbox span{display:none}}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

<div class="app">
  <nav class="side" aria-label="Secciones">
    <div class="brand">Mitash<small>Gestión de metrología</small></div>
    <button class="navbtn" data-view="buscar">🔎 Buscar equipo</button>
    <button class="navbtn" data-view="agenda">Agenda y recordatorios</button>
    <button class="navbtn" data-view="tareas">Tareas pendientes</button>
    <button class="navbtn" data-view="ingresos">Ingresos al taller</button>
    <button class="navbtn" data-view="pendientes">Para hacer (vencimientos)</button>
    <button class="navbtn" data-view="prestamos">Termómetros Mitash</button>
    <button class="navbtn" data-view="pagos">Pagos (Meli y Jorge)</button>
    <button class="navbtn" data-view="tablero">Tablero general</button>
    <button class="navbtn" data-view="calendario">Vencimientos</button>
    <div class="navgroup">Micropipetas</div>
    <button class="navbtn" data-view="panel">Panel micropipetas</button>
    <button class="navbtn" data-view="micro">Informes</button>
    <button class="navbtn" data-view="porcliente">Por cliente</button>
    <button class="navbtn" data-view="stats">Estadísticas</button>
    <div class="navgroup">Otras áreas</div>
    <button class="navbtn" data-view="trabajos">Todos los trabajos</button>
    <button class="navbtn" data-view="area:Temperatura">Temperatura</button>
    <button class="navbtn" data-view="area:Cabinas y campanas">Cabinas y campanas</button>
    <button class="navbtn" data-view="area:Centrífugas">Centrífugas</button>
    <button class="navbtn" data-view="area:Perfiles térmicos">Perfiles térmicos</button>
    <button class="navbtn" data-view="area:Reparaciones">Reparaciones</button>
    <div class="navgroup">Empresa</div>
    <button class="navbtn" data-view="clientes">Clientes</button>
    <button class="navbtn" data-view="soon-compras">Compras<span class="soon">pronto</span></button>
    <button class="navbtn" data-view="soon-equipos">Equipos propios<span class="soon">pronto</span></button>
    <button class="navbtn" data-view="soon-bot">Bot de WhatsApp<span class="soon">pronto</span></button>
    <button class="navbtn" data-view="importar">Importar datos</button>
    <button class="navbtn" data-view="bitacora">Bitácora del sistema</button>
    <div class="userbox" id="userbox" hidden><span id="useremail"></span><button class="navbtn" id="logout">Cerrar sesión</button></div>
  </nav>
  <main id="main"><p class="empty">Cargando… (v3)</p></main>
</div>
<div id="overlay"></div>

<script>
// Si algo falla, mostrarlo en pantalla (para poder mandar captura) en vez de quedar en "Cargando…"
window.addEventListener('error',e=>{ const m=document.getElementById('main'); if(m) m.innerHTML='<div class="banner">Error: '+String(e.message||e).replace(/</g,'&lt;')+' (v3)</div>'; });
window.addEventListener('unhandledrejection',e=>{ const m=document.getElementById('main'); if(m) m.innerHTML='<div class="banner">Error: '+String((e.reason&&e.reason.message)||e.reason).replace(/</g,'&lt;')+' (v3)</div>'; });
(function(){
const HOY = new Date(); HOY.setHours(0,0,0,0);
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const S={base:[],trab:[],term:[],prest:{},vis:{},ent:{},rec:{},tar:{},ing:{},pag:{},avp:{},evt:{},ft:{q:'',area:'',anio:'',cliente:''},over:{},clientes:{},view:'agenda',db:null,f:{q:'',anio:'',cliente:'',res:'',fac:''},page:0,calTab:'prox',pcAnio:String(new Date().getFullYear()),stAnio:String(new Date().getFullYear())};
try{ const v=localStorage.getItem('mitash.view'); if(v) S.view=v; }catch(e){}
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pd=s=>{ if(!s) return null; const [y,m,d]=String(s).slice(0,10).split('-').map(Number); return new Date(y,m-1,d); };
const fmt=d=>d?String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear():'';
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addY=(d,n)=>new Date(d.getFullYear()+n,d.getMonth(),d.getDate());
const days=(a,b)=>Math.round((a-b)/86400000);
const slug=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'sin-nombre';
const miss=t=>`<span class="missing">${esc(t||'completar')}</span>`;
function toast(t){ const el=document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),2400); }

function all(){
  const m=new Map(); S.base.forEach(r=>m.set(r.informe,Object.assign({},r)));
  Object.entries(S.over).forEach(([k,o])=>{ if(o&&o.borrado){m.delete(k);return;} m.set(k,Object.assign(m.get(k)||{},o,{informe:k})); });
  return [...m.values()].sort((a,b)=>b.informe.localeCompare(a.informe,undefined,{numeric:true}));
}
function resChip(r){ const t=(r.resultado||'').toLowerCase();
  if(!t) return '<span class="chip na">sin dato</span>';
  if(t.startsWith('no cumple')) return '<span class="chip warn">Requirió ajuste</span>';
  if(t.startsWith('cumple')) return '<span class="chip ok">Cumple</span>';
  return `<span class="chip na">${esc(r.resultado)}</span>`; }
function pagoChip(r){ if(r.pago_tecnico==='Pago') return '<span class="chip ok">Pago</span>'; if(r.pago_tecnico==='Impago') return '<span class="chip bad">Impago</span>'; return '<span class="empty">—</span>'; }
function vol(r){ if(r.vmin!=null&&r.vmax!=null&&r.vmin!==r.vmax) return r.vmin+'–'+r.vmax+' µl'; if(r.vnom) return r.vnom+' µl'; return ''; }

// Una pipeta = un ID; su próximo vencimiento es 1 año después del último informe.
function pipetas(){
  const g=new Map();
  all().forEach(r=>{ if(!r.id) return; const k=String(r.id).toUpperCase().replace(/\s+/g,''); const d=pd(r.fecha); if(!d) return;
    const cur=g.get(k); if(!cur||d>cur.ult){ g.set(k,{id:r.id,cliente:r.cliente,marca:r.marca,ult:d,informe:r.informe,n:(cur?cur.n:0)+1}); } else cur.n++; });
  return [...g.values()].map(p=>{ p.prox=addY(p.ult,1); p.dias=days(p.prox,HOY);
    p.estado = p.dias<0 ? (p.dias>=-180?'vencida':'inactiva') : (p.dias<=30?'prox':'ok'); return p; });
}
function estChip(p){ return {vencida:'<span class="chip bad">Vencida</span>',prox:'<span class="chip warn">Vence pronto</span>',ok:'<span class="chip ok">Al día</span>',inactiva:'<span class="chip na">Sin volver (+6 meses)</span>'}[p.estado]; }

function setView(v){ if(v.startsWith('area:')){ S.ft={q:'',area:v.slice(5),anio:'',cliente:''}; } else if(v==='trabajos'){ S.ft.area=''; }
  S.view=v; S.page=0; try{localStorage.setItem('mitash.view',v);}catch(e){} render(); window.scrollTo(0,0); }
document.querySelectorAll('.navbtn[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));

function render(){
  document.querySelectorAll('.navbtn').forEach(b=>b.toggleAttribute('aria-current',b.dataset.view===S.view)); document.querySelectorAll('.navbtn[aria-current]').forEach(b=>b.setAttribute('aria-current','page'));
  const v=S.view, M=$('#main');
  const warn = S.db===null && S.dbChecked ? '<div class="banner">En esta vista los cambios no se guardan (la base compartida no está disponible). Podés consultar todo igual.</div>' : '';
  if(v==='agenda') M.innerHTML=warn+vAgenda();
  else if(v==='tareas') M.innerHTML=warn+vTareas();
  else if(v==='pagos') M.innerHTML=warn+vPagos();
  else if(v==='bitacora') M.innerHTML=vBitacora();
  else if(v==='buscar') M.innerHTML=vBuscar();
  else if(v==='ingresos') M.innerHTML=warn+vIngresos();
  else if(v==='tablero') M.innerHTML=warn+vTablero();
  else if(v==='trabajos'||v.startsWith('area:')) M.innerHTML=warn+vTrab();
  else if(v==='panel') M.innerHTML=warn+vPanel();
  else if(v==='micro') M.innerHTML=warn+vMicro();
  else if(v==='calendario') M.innerHTML=warn+vCal();
  else if(v==='pendientes') M.innerHTML=warn+vPend();
  else if(v==='importar') M.innerHTML=vImportar();
  else if(v==='prestamos') M.innerHTML=warn+vPrest();
  else if(v==='clientes') M.innerHTML=warn+vClientes();
  else if(v==='porcliente') M.innerHTML=warn+vPorCliente();
  else if(v==='stats') M.innerHTML=warn+vStats();
  else M.innerHTML=vSoon(v);
  bind();
}

function vPanel(){
  const A=all(), y=HOY.getFullYear(), m=HOY.getMonth();
  const esteMes=A.filter(r=>{const d=pd(r.fecha);return d&&d.getFullYear()===y&&d.getMonth()===m;});
  const esteAnio=A.filter(r=>(r.fecha||'').startsWith(String(y)));
  const P=pipetas(); const venc=P.filter(p=>p.estado==='vencida'), prox=P.filter(p=>p.estado==='prox');
  const sinFac=esteAnio.filter(r=>!r.facturado).length, sinEnv=esteAnio.filter(r=>!r.enviado).length;
  const meses=[]; for(let i=11;i>=0;i--){ const d=new Date(y,m-i,1); const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); meses.push({k,l:MES3[d.getMonth()],n:A.filter(r=>(r.fecha||'').startsWith(k)).length}); }
  const mx=Math.max(1,...meses.map(x=>x.n));
  const porCli={}; esteAnio.forEach(r=>{const c=r.cliente||'(sin cliente)'; porCli[c]=(porCli[c]||0)+1;});
  const top=Object.entries(porCli).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const lista=[...venc.sort((a,b)=>b.dias-a.dias),...prox.sort((a,b)=>a.dias-b.dias)].slice(0,10);

function filtered(){
  const f=S.f, q=f.q.trim().toLowerCase();
  return all().filter(r=>{
    if(f.anio && !(r.fecha||'').startsWith(f.anio)) return false;
    if(f.cliente && (r.cliente||'(sin cliente)')!==f.cliente) return false;
    if(f.res){ const t=(r.resultado||'').toLowerCase(); if(f.res==='ok'&&!t.startsWith('cumple')) return false; if(f.res==='aj'&&!t.startsWith('no cumple')) return false; if(f.res==='na'&&t) return false; }
    if(f.fac==='no' && r.facturado) return false; if(f.fac==='si' && !r.facturado) return false;
    if(q && ![r.informe,r.id,r.cliente,r.marca,r.modelo].some(x=>String(x||'').toLowerCase().includes(q))) return false;
    return true; });
}

// "194" encuentra IA-194, IA 194, IA-194 Rossi…; "hj123" encuentra HJ123. Junta todas las fuentes.
const claveId=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function coincide(texto,q){ const t=claveId(texto), k=claveId(q); if(!k) return false;
  if(/^\d+$/.test(k)) return new RegExp('(^|[A-Z])0*'+k+'(?!\\d)').test(t); // número suelto: que no sea parte de otro número
  return t.includes(k); }
function historialEquipo(q){
  const ev=[];
  all().forEach(r=>{ if(coincide(r.id,q)||coincide(r.codigo_cliente,q)) ev.push({fecha:r.fecha,area:'Micropipeta',que:(r.trabajo||'Calibración')+' · '+(/^no cumple/i.test(r.resultado||'')?'requirió ajuste':/^cumple/i.test(r.resultado||'')?'cumple':'sin resultado'),cliente:r.cliente,ref:r.informe,id:r.id,detalle:[r.marca,r.modelo,vol(r)].filter(Boolean).join(' '),inf:r.informe}); });
  S.term.forEach(t=>{ if(coincide(t.id,q)||coincide(t.serie,q)) ev.push({fecha:t.fecha,area:'Termómetro',que:'Calibración',cliente:t.cliente,ref:t.informe,id:t.id,detalle:[t.marca,t.sede].filter(Boolean).join(' · ')}); });
  S.trab.forEach(t=>{ if(coincide(t.detalle,q)||coincide(t.codigo,q)||(q.length>=4&&!/^\d+$/.test(q.trim())&&String(t.detalle||'').toLowerCase().includes(q.trim().toLowerCase()))) ev.push({fecha:t.fecha,area:t.area,que:t.area==='Reparaciones'?'Correctivo'+(t.origen==='whatsapp'?' (WhatsApp)':''):t.area==='Cabinas y campanas'?'Validación / preventivo':'Control / preventivo',cliente:t.cliente,ref:t.codigo,id:t.detalle,detalle:(t.archivos||[])[0]||''}); });
  Object.values(S.ing).forEach(x=>{ if(!x.borrado&&(coincide(x.serie,q)||String(x.ids||'').split(/[\n,;]+/).some(i=>coincide(i,q)))) ev.push({fecha:x.fecha,area:'Taller',que:'Ingresó al taller · '+(x.estado||'Ingresado'),cliente:x.cliente,ref:x.remito||'',id:x.serie||q,detalle:x.motivo||''}); });
  Object.values(S.evt).forEach(e=>{ if(!e.borrado&&coincide(e.equipo_id,q)) ev.push({fecha:e.fecha,area:e.tipo||'Trabajo',que:e.detalle||e.tipo||'',cliente:e.cliente,ref:e.informe||'',id:e.equipo_id,detalle:[e.quien,e.origen==='whatsapp'?'desde WhatsApp':'cargado a mano'].filter(Boolean).join(' · ')}); });
  Object.values(S.tar).forEach(t=>{ if(!t.borrado&&coincide(t.texto,q)) ev.push({fecha:t.creado||t.para,area:'Tarea',que:t.texto+(t.estado==='hecho'?' (hecha)':''),cliente:t.cliente,ref:'',id:'',detalle:t.responsable||''}); });
  Object.values(S.prest).forEach(p=>{ if(coincide(p.id,q)||coincide(p.reemplaza,q)) ev.push({fecha:p.desde||'',area:'Préstamo',que:`${p.id} ${/disponible/i.test(p.estado||'')?'disponible':'en '+(p.esta_en||p.cliente||'cliente')}`,cliente:p.cliente,ref:p.certificado||'',id:p.id,detalle:p.reemplaza?'reemplaza a '+p.reemplaza:''}); });
  return ev.sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
}

  return micro.concat(S.trab.map(t=>({area:t.area,fecha:t.fecha,cliente:t.cliente,codigo:t.codigo,detalle:t.detalle,pdf:t.pdf,tid:t.id})));
}

function vImportar(){
  return `<div class="head"><div style="flex:1;min-width:200px"><div class="eyebrow">Datos del Drive</div><h1>Importar datos</h1></div></div>
  <div class="card"><p style="margin:0 0 12px">Elegí los archivos <span class="mono">historial.json</span>, <span class="mono">termometros.json</span>, <span class="mono">prestamos.json</span> y/o <span class="mono">trabajos.json</span> (los genera Claude desde las carpetas del Drive). Se pueden cargar las veces que haga falta: actualiza lo que ya está, no duplica.</p>
    <div class="field"><label for="impf">Archivos</label><input id="impf" type="file" accept=".json,application/json" multiple></div>
    <div style="margin-top:12px"><button class="btn primary" id="impgo">Importar</button></div>
    <p class="eyebrow" id="impmsg" style="margin:12px 0 0">Ahora hay ${S.base.length} informes de micropipetas y ${S.trab.length} trabajos de otras áreas cargados.</p></div>`;
}
async function importar(){
  const files=[...($('#impf').files||[])], msg=$('#impmsg');
  if(!files.length){ msg.textContent='Elegí al menos un archivo.'; return; }
  if(!sb||!S.db){ msg.textContent='Para importar tenés que entrar con tu usuario.'; return; }
  try{
    for(const f of files){
      const L=JSON.parse(await f.text()); if(!Array.isArray(L)||!L.length) throw new Error(f.name+' no tiene datos');
      // qué archivo es: termómetros (archivo en Temperatura), micropipetas (informe), préstamos (M-x con estado) u otras áreas
      const r0=L[0], tipo=String(r0.archivo||'').startsWith('Temperatura')?'termometros':('informe' in r0)?'informes':('estado' in r0&&!('area' in r0))?'prestamos':'trabajos';
      if(tipo==='prestamos'){ for(const p of L){ const k=String(p.id).replace(/\s+/g,''); if(!S.prest[k]) await S.db.doc('prestamos/'+k).set(p); } continue; }
      const filas=L.map(r=>tipo==='trabajos'?{id:r.id,data:r}:{informe:r.informe,data:r});
      for(let i=0;i<filas.length;i+=300){ msg.textContent=`${f.name}: ${Math.min(i+300,filas.length)} de ${filas.length}…`;
        const {error}=await sb.from(tipo).upsert(filas.slice(i,i+300)); if(error) throw error; }
    }
    [S.base,S.trab,S.term]=await Promise.all([cargarTabla('informes'),cargarTabla('trabajos'),cargarTabla('termometros')]);
    toast('Datos importados'); render();
  }catch(e){ msg.textContent='No se pudo importar: '+(e.message||e); }
}

// ---- "Para hacer": TODO lo que vence (micropipetas cada 1 año; termómetros cada 6 meses en Maipú, 1 año el resto).
// Frecuencia en meses según área y cliente. Los equipos propios de Mitash no se cuentan.
const FREQ=(area,cli)=> area==='Termómetro' && /maip/i.test(cli||'') ? 6 : 12; // centrífugas: 12 hasta que confirmen
// Equipos propios de Mitash (termómetros M-x): último certificado y próxima calibración (1 año). Aviso 14 días antes.
function propios(){
  const g=new Map();
  S.term.filter(t=>t.propio&&t.id).forEach(t=>{ const k=normId(t.id); const c=g.get(k); if(!c||t.fecha>c.fecha) g.set(k,t); });
  const ids=new Set([...Object.values(S.prest).map(p=>normId(p.id)),...g.keys()]);
  return [...ids].map(k=>{ const p=Object.entries(S.prest).find(([,x])=>normId(x.id)===k)||[k.replace(/^M(\d)/,'M-$1'),{id:k.replace(/^M(\d)/,'M-$1')}];
    const t=g.get(k); const ult=t?pd(t.fecha):null; const prox=ult?addM(ult,12):null;
    return {k:p[0],...p[1],cert:t?t.informe:(p[1].certificado||''),ult,prox,dias:prox?days(prox,HOY):null}; })
    .sort((a,b)=>(parseInt(String(a.id).replace(/\D/g,''))||0)-(parseInt(String(b.id).replace(/\D/g,''))||0));
}
// Avisos automáticos: lo mismo que después manda el bot por WhatsApp.
function avisos(){
  const A=[], y=HOY.getFullYear(), m=HOY.getMonth();
  const pr=propios().filter(p=>p.dias!=null&&p.dias<=14);
  if(pr.length) A.push({tipo:'warn',txt:`Calibrar equipos propios: ${pr.map(p=>p.id).join(', ')} (${pr[0].dias<0?'vencidos':'vencen el '+fmt(pr[0].prox)})`,go:'prestamos'});
  const V=vencimientos().filter(x=>x.prox.getFullYear()===y&&x.prox.getMonth()===m);
  cnt(V,x=>x.cliente).forEach(([c,n])=>A.push({tipo:'acc',txt:`Avisar a ${c}: este mes le tocan ${n} equipo${n>1?'s':''} (${cnt(V.filter(x=>x.cliente===c),x=>x.area).map(([a,k])=>k+' '+a.toLowerCase()+(k>1?'s':'')).join(', ')})`,go:'pendientes'}));
  const at=ingresosAbiertos().filter(x=>x.dias>=ING_CRITICO&&x.estado!=='Listo para entregar');
  if(at.length) A.push({tipo:'bad',txt:`${at.length} equipo${at.length>1?'s':''} atascado${at.length>1?'s':''} en el taller hace más de ${ING_CRITICO} días: ${at.slice(0,4).map(x=>x.cliente+' '+(x.equipo||'')).join(', ')}${at.length>4?'…':''}`,go:'ingresos'});
  const listos=ingresosAbiertos().filter(x=>x.estado==='Listo para entregar');
  if(listos.length) A.push({tipo:'ok',txt:`Listos para entregar: ${listos.map(x=>x.cliente+' '+(x.equipo||'')).join(', ')}`,go:'ingresos'});
  const hoyI=iso(HOY), tu=Object.values(S.tar).filter(t=>t.estado!=='hecho'&&!t.borrado&&(t.prioridad==='Urgente'||(t.para&&t.para<=hoyI)));
  tu.forEach(t=>A.push({tipo:t.prioridad==='Urgente'?'bad':'warn',txt:`Tarea${t.responsable?' de '+t.responsable:''}: ${t.texto}${t.para?' (para el '+fdia(t.para)+')':''}`,go:'tareas'}));
  const sinVisita=entregasPend().filter(e=>!visitasProx(60).some(v=>mismoCliente(v.cliente,e.cliente)));
  sinVisita.forEach(e=>A.push({tipo:'bad',txt:`${e.tipo||'Entregar'} en ${e.cliente}: ${e.que} — no hay ninguna visita programada`,go:'agenda'}));
  return A;
}
const addM=(d,n)=>new Date(d.getFullYear(),d.getMonth()+n,d.getDate());
function vencimientos(){
  const out=[];
  pipetas().forEach(p=>{ if(/mitash/i.test(p.cliente||'')) return; const r=all().find(x=>x.informe===p.informe)||{};
    out.push({area:'Micropipeta',id:p.id,cliente:p.cliente||'(sin cliente)',sede:r.sector||'',detalle:[r.codigo_cliente,r.marca,vol(r)].filter(Boolean).join(' · '),ult:p.ult,informe:p.informe}); });
  const g=new Map(); S.term.forEach(t=>{ if(t.propio||!t.id) return; const k=normId(t.id)+'|'+slug(t.cliente); const d=pd(t.fecha); const c=g.get(k); if(!c||d>c.ult) g.set(k,{t,ult:d}); });
  g.forEach(({t,ult})=>out.push({area:'Termómetro',id:t.id,cliente:t.cliente||'(sin cliente)',sede:t.sede||'',detalle:[t.marca,t.departamento].filter(Boolean).join(' · '),ult,informe:t.informe}));
  // centrífugas (2025 en adelante): el "equipo" sale del nombre del archivo (ej. "EQ 2 Martinez", "IA-155")
  const gc=new Map(); S.trab.filter(t=>t.area==='Centrífugas'&&t.fecha>='2025'&&t.cliente).forEach(t=>{ const eq=(t.detalle||t.codigo.slice(7)||'').trim(); if(!eq) return;
    const k=slug(t.cliente)+'|'+slug(eq.replace(/\s*-\s*/g,'-')); const d=pd(t.fecha); const c=gc.get(k); if(!c||d>c.ult) gc.set(k,{t,eq,ult:d}); });
  gc.forEach(({t,eq,ult})=>out.push({area:'Centrífuga',id:eq,cliente:t.cliente,sede:'',detalle:'',ult,informe:t.codigo}));
  out.forEach(x=>{ x.meses=FREQ(x.area,x.cliente); x.prox=addM(x.ult,x.meses); x.dias=days(x.prox,HOY); });
  return out;
}
function mensajeCliente(cli,items,mesTxt){
  const porSede={}; items.forEach(x=>(porSede[x.sede||'']=porSede[x.sede||'']||[]).push(x));
  let t=`Hola! Les escribimos de Mitash. ${mesTxt} les toca la calibración de:\n`;
  Object.entries(porSede).forEach(([s,L])=>{ t+=`\n${s?'*'+s+'*\n':''}`; L.forEach(x=>t+=`- ${x.area} ID ${x.id}${x.detalle?' ('+x.detalle+')':''}\n`); });
  return t+`\n¿Coordinamos día para pasar a buscarlos o calibrarlos? Gracias!`;
}

function fichaCliente(k){ const x=S.clientes[k]||{}; const nombre=x.nombre||(all().find(r=>r.cliente&&slug(r.cliente)===k)||{}).cliente||'';
  drawer(`<div class="eyebrow">Cliente</div><h2>${esc(nombre||'Nuevo cliente')}</h2><form class="form" id="fc">
  ${[['nombre','Nombre'],['contacto','Persona de contacto'],['email','Email para informes (separá varios con coma)'],['tel','Teléfono / WhatsApp'],['direccion','Dirección'],['cuit','CUIT / razón social para facturar']].map(([f,l])=>`<div class="field full"><label for="c-${f}">${l}</label><input id="c-${f}" value="${esc(f==='nombre'?nombre:x[f])}"></div>`).join('')}
  <div class="field full"><label for="c-notas">Notas (frecuencia de termómetros por contrato, etc.)</label><textarea id="c-notas">${esc(x.notas||'')}</textarea></div>
  <div class="full" style="display:flex;gap:10px"><button class="btn primary" type="submit">Guardar</button><button class="btn" type="button" data-close>Cancelar</button></div></form>`);
  $('#fc').addEventListener('submit',async e=>{ e.preventDefault(); const o={}; ['nombre','contacto','email','tel','direccion','cuit','notas'].forEach(f=>{const v=$('#c-'+f).value.trim(); o[f]=v||null;});
    if(!o.nombre){toast('Poné el nombre del cliente');return;} const key=k||slug(o.nombre);
    if(!S.db){ toast('No se pudo guardar: la base compartida no está disponible en esta vista'); return; }
    try{ await S.db.doc('clientes/'+key).set(o); S.clientes[key]=o; $('#overlay').innerHTML=''; render(); toast('Cliente guardado'); }catch(err){ toast('No se pudo guardar. Probá de nuevo.'); } }); }

    const base=all().find(x=>x.informe===k)||{}; const o=Object.assign({},S.over[k]||{},{[f]:cb.checked,editado:new Date().toISOString()});
    try{ await S.db.doc('informes/'+k).set(Object.assign({},base,o)); S.over[k]=Object.assign({},base,o); toast(f==='enviado'?(cb.checked?'Marcado como enviado':'Desmarcado'):(cb.checked?'Marcado como facturado':'Desmarcado')); }
    catch(e){ cb.checked=!cb.checked; toast('No se pudo guardar. Probá de nuevo.'); } }));
  const fq=$('#fq'); if(fq) fq.addEventListener('input',()=>{ clearTimeout(qTimer); qTimer=setTimeout(()=>{ S.f.q=fq.value; S.page=0; const pos=fq.selectionStart; render(); const n=$('#fq'); n.focus(); n.setSelectionRange(pos,pos); },200); });
  [['tarea','area'],['tanio','anio'],['tcli','cliente']].forEach(([id,k])=>{ const el=$('#'+id); if(el) el.onchange=()=>{S.ft[k]=el.value;if(k==='area'){S.ft.anio='';S.ft.cliente='';S.view=el.value?'area:'+el.value:'trabajos';}S.page=0;render();}; });
  const tq=$('#tq'); if(tq) tq.addEventListener('input',()=>{ clearTimeout(qTimer); qTimer=setTimeout(()=>{ S.ft.q=tq.value; S.page=0; const pos=tq.selectionStart; render(); const n=$('#tq'); n.focus(); n.setSelectionRange(pos,pos); },200); });
  const ig=$('#impgo'); if(ig) ig.onclick=importar;
  M.querySelectorAll('[data-parea]').forEach(b=>b.onclick=()=>{S.pendArea=b.dataset.parea;render();});
  M.querySelectorAll('[data-copymsg]').forEach(b=>b.onclick=async e=>{ e.preventDefault(); try{ await navigator.clipboard.writeText(S._msgs[b.dataset.copymsg]); toast('Mensaje copiado'); }catch(err){ prompt('Copiá el mensaje:',S._msgs[b.dataset.copymsg]); } });
  M.querySelectorAll('[data-wamsg]').forEach(b=>b.onclick=e=>{ e.preventDefault(); window.open('https://wa.me/?text='+encodeURIComponent(S._msgs[b.dataset.wamsg]),'_blank'); });
  M.querySelectorAll('[data-avsnooze]').forEach(b=>b.onclick=async()=>{ const [k,h]=b.dataset.avsnooze.split(':'); const d=new Date(Date.now()+Number(h)*3600000); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
    if(!S.db){ toast('Para guardar tenés que entrar con tu usuario'); return; }
    const o={hasta:d.toISOString().slice(0,16)}; try{ await S.db.doc('avisos/'+k).set(o); S.avp[k]=o; render(); toast(Number(h)===6?'Pospuesto 6 horas':'Pospuesto 1 día'); }catch(e){ toast('No se pudo guardar'); } });
  const bq=$('#bq'); if(bq){ bq.addEventListener('input',()=>{ clearTimeout(qTimer); qTimer=setTimeout(()=>{ S.bq=bq.value; const pos=bq.selectionStart; render(); const n=$('#bq'); n.focus(); n.setSelectionRange(pos,pos); },250); }); if(!S.bq) bq.focus(); }
  M.querySelectorAll('[data-infq]').forEach(r=>r.onclick=()=>{ const x=all().find(y=>y.informe===r.dataset.infq); x&&ficha(x,false); });
  M.querySelectorAll('[data-remito]').forEach(b=>b.onclick=()=>remito(b.dataset.remito));
  M.querySelectorAll('[data-pnew]').forEach(b=>b.onclick=()=>editarPrest(null));
  M.querySelectorAll('[data-pedit]').forEach(b=>b.onclick=()=>editarPrest(b.dataset.pedit));
  const COL={vis:S.vis,ent:S.ent,rec:S.rec,tar:S.tar,ing:S.ing};
  M.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>editar(b.dataset.new,null));
  M.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{ const [c,id]=b.dataset.edit.split(':'); editar(c,id); });
  M.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{ const [c,id]=b.dataset.done.split(':'); const x=COL[c][id];
    if(c==='rec'&&x.repetir){ // recordatorio repetitivo: pasa a la próxima fecha
      const d=new Date(x.cuando); if(x.repetir==='cada semana') d.setDate(d.getDate()+7); else if(x.repetir==='cada mes') d.setMonth(d.getMonth()+1); else d.setFullYear(d.getFullYear()+1);
      d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); guardar(c,id,Object.assign({},x,{cuando:d.toISOString().slice(0,16),pospuesto_hasta:null})); return; }
    guardar(c,id,Object.assign({},x,{estado:'hecho',hecho_el:iso(HOY)})); });
  M.querySelectorAll('[data-snooze]').forEach(b=>b.onclick=()=>{ const [id,h]=b.dataset.snooze.split(':'); const d=new Date(Date.now()+Number(h)*3600000); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
    guardar('rec',id,Object.assign({},S.rec[id],{pospuesto_hasta:d.toISOString().slice(0,16)})); });
  const pa=$('#pcanio'); if(pa) pa.onchange=()=>{S.pcAnio=pa.value;render();};
  const sa=$('#stanio'); if(sa) sa.onchange=()=>{S.stAnio=sa.value;render();};
  [['fanio','anio'],['fcli','cliente'],['fres','res'],['ffac','fac']].forEach(([id,k])=>{ const el=$('#'+id); if(el) el.onchange=()=>{S.f[k]=el.value;S.page=0;render();}; });
}

// ---- Base de datos: Supabase (login del equipo). Los datos de clientes viven solo ahí, nunca en el código público.
const SB_URL='https://wjebfabcivxmeohyfpxm.supabase.co';
const SB_KEY='sb_publishable_OwWLV4rfTm58MB7rouvJnw_TDEBfU6J';
// lock simple: el lock por defecto (navigator.locks) se cuelga en algunos navegadores de iPhone y la app quedaba en "Cargando…"
const sb = window.supabase ? window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,lock:async(_n,_t,fn)=>await fn()}}) : null;
const conTiempo=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('tiempo')),ms))]);

// Misma forma que usaba la versión anterior: db.doc('coleccion/id').set(obj) y db.collection(c).onSnapshot(cb).
function supaDB(){
  return {
    doc(path){ const i=path.indexOf('/'), coleccion=path.slice(0,i), id=path.slice(i+1);
      return { async set(o){ const {error}=await sb.from('docs').upsert({coleccion,id,data:o}); if(error) throw error; } }; },
    collection(coleccion){ return { onSnapshot(cb,onErr){
      const load=async()=>{ const {data,error}=await sb.from('docs').select('id,data').eq('coleccion',coleccion);
        if(error){ onErr&&onErr(error); return; } cb({docs:data.map(d=>({id:d.id,data:()=>d.data}))}); };
      load();
      sb.channel('docs-'+coleccion).on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'coleccion=eq.'+coleccion},load).subscribe();
    } }; }
  };
}
async function cargarTabla(tabla){
  const out=[]; for(let from=0;;from+=1000){ const {data,error}=await sb.from(tabla).select('data').range(from,from+999);
    if(error) throw error; out.push(...data.map(d=>d.data)); if(data.length<1000) break; }
  return out;
}
function vLogin(msg){
  document.querySelector('.app').hidden=true;
  let L=$('#login'); if(!L){ L=document.createElement('div'); L.id='login'; document.body.appendChild(L); }
  L.className='login'; L.hidden=false;
  L.innerHTML=`<form id="flogin"><div><div class="eyebrow">Gestión de metrología</div><h1>Mitash</h1></div>
    <div class="field"><label for="lemail">Email</label><input id="lemail" type="email" autocomplete="username" required></div>
    <div class="field"><label for="lpass">Contraseña</label><input id="lpass" type="password" autocomplete="current-password" required></div>
    <div class="err" id="lerr">${esc(msg||'')}</div>
    <button class="btn primary" type="submit">Entrar</button><div class="eyebrow">v3</div></form>`;
  $('#flogin').onsubmit=async e=>{ e.preventDefault(); $('#lerr').textContent='Entrando…';
    let error; try{ ({error}=await conTiempo(sb.auth.signInWithPassword({email:$('#lemail').value.trim(),password:$('#lpass').value}),15000)); }catch(e){ error=e; }
    if(error){ $('#lerr').textContent=error.message==='tiempo'?'No responde el servidor. Revisá internet y probá de nuevo.':'Email o contraseña incorrectos.'; return; }
    L.hidden=true; arrancar(); };
}
async function arrancar(){
  document.querySelector('.app').hidden=false;
  const {data:{session}}=await sb.auth.getSession();
  $('#userbox').hidden=false; $('#useremail').textContent=session?session.user.email:'';
  $('#logout').onclick=async()=>{ await sb.auth.signOut(); location.reload(); };
  $('#main').innerHTML='<p class="empty">Cargando informes…</p>';
  try{ [S.base,S.trab,S.term]=await Promise.all([cargarTabla('informes'),cargarTabla('trabajos'),cargarTabla('termometros')]); }catch(e){ $('#main').innerHTML='<div class="banner">No se pudieron cargar los informes. Revisá la conexión y recargá la página.</div>'; return; }
  S.db=supaDB(); S.dbChecked=true;
  if(!S.base.length && !S.trab.length) S.view='importar'; // base vacía: primero cargar los datos
  render();
  S.db.collection('informes').onSnapshot(s=>{ S.over={}; s.docs.forEach(d=>S.over[d.id]=d.data()); if(!$('#overlay').innerHTML) render(); }, ()=>{});
  S.db.collection('clientes').onSnapshot(s=>{ S.clientes={}; s.docs.forEach(d=>S.clientes[d.id]=d.data()); if(!$('#overlay').innerHTML) render(); }, ()=>{});
  escucharAgenda();
}
function escucharAgenda(){
  [['visitas','vis'],['entregas','ent'],['recordatorios','rec'],['prestamos','prest'],['tareas','tar'],['ingresos','ing'],['pagos','pag'],['avisos','avp'],['eventos','evt']].forEach(([c,k])=>S.db.collection(c).onSnapshot(s=>{
    const o={}; s.docs.forEach(d=>{ const x=d.data(); if(!x.borrado) o[d.id]=x; }); S[k]=o; if(!$('#overlay').innerHTML) render(); }, ()=>{}));
}
// Base en memoria para probar en la compu sin login (?local). No guarda nada de verdad.
function memDB(){ const store={}, subs={};
  return { doc(path){ const [c,id]=path.split('/'); return { async set(o){ (store[c]=store[c]||{})[id]=o; (subs[c]||[]).forEach(f=>f()); } }; },
    collection(c){ return { onSnapshot(cb){ const f=()=>cb({docs:Object.entries(store[c]||{}).map(([id,d])=>({id,data:()=>d}))}); (subs[c]=subs[c]||[]).push(f); f(); } }; } }; }
async function init(){
  // Solo para probar en la compu (http://localhost:8765/?local): usa los JSON locales, sin login y sin guardar.
  if(location.hostname==='localhost' && location.search.includes('local')){
    S.base=await (await fetch('historial.json')).json(); S.trab=await (await fetch('trabajos.json')).json();
    S.term=await (await fetch('termometros.json')).json();
    try{ S.trab=S.trab.concat(await (await fetch('trabajos_whatsapp.json')).json()); }catch(e){}
    S.db=memDB(); S.dbChecked=true;
    for(const p of await (await fetch('prestamos.json')).json()) await S.db.doc('prestamos/'+p.id.replace(/\s+/g,'')).set(p);
    try{ for(const p of await (await fetch('pagos.json')).json()) await S.db.doc('pagos/'+p.id).set(p); }catch(e){}
    escucharAgenda(); render(); return;
  }
  if(!sb){ $('#main').innerHTML='<div class="banner">No se pudo conectar. Revisá internet y recargá la página.</div>'; return; }
  let session=null;
  try{ ({data:{session}}=await conTiempo(sb.auth.getSession(),5000)); }catch(e){ session=null; }
  if(session) arrancar(); else vLogin();
}
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
init();
})();
